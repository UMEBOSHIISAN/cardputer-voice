[env:cardputer_adv]
platform = espressif32@6.7.0
platform_packages = platformio/tool-esptoolpy@2.41100.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    https://github.com/m5stack/M5Cardputer.git#f1392858b9994c3547120e602a57d3553d16ab01
    m5stack/M5Unified@0.2.19
    m5stack/M5GFX@0.2.26
    arduino-irremote/IRremote@4.7.1
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -ffile-prefix-map="$PROJECT_PACKAGES_DIR"=packages
    -ffile-prefix-map="$PROJECT_DIR"=.
upload_speed = 115200
